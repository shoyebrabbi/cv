<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting... | Md Shoyeb Rabbi Portfolio</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Keeps query string and hash intact
      (function () {
        var currentSearch = window.location.search || '';
        var currentHash = window.location.hash || '';
        var redirectUrl = './' + currentSearch + currentHash;
        window.location.replace(redirectUrl);
      })();
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #070B14;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .card {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(59, 130, 246, 0.3);
        border-radius: 16px;
        padding: 32px;
        max-width: 420px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }
      h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #60a5fa; }
      p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
      a {
        display: inline-block;
        padding: 10px 24px;
        background: #2563eb;
        color: #ffffff;
        text-decoration: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        transition: background 0.2s;
      }
      a:hover { background: #1d4ed8; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Redirecting to CV Studio...</h1>
      <p>If you are not redirected automatically within a few seconds, please click the button below:</p>
      <a href="./">Open CV Studio &amp; Portfolio</a>
    </div>
  </body>
</html>
